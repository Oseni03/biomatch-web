name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biomatch
          POSTGRES_PASSWORD: biomatch
          POSTGRES_DB: biomatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://biomatch:biomatch@localhost:5432/biomatch_test
      BETTER_AUTH_SECRET: ci-test-secret-please-change-in-production
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build
      - run: |
          npm start -- --port 3000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then
              kill $SERVER_PID
              exit 0
            fi
            sleep 2
          done
          echo "health endpoint did not become ready"
          kill $SERVER_PID
          exit 1
